# http://developer.wildernesslabs.co/Meadow/Meadow.OS/Configuration/Application_Settings_Configuration/

Lifecycle:
    RestartOnAppFailure: true
    AppFailureRestartDelaySeconds: 15

Logging:
    LogLevel:
        # Trace, Debug, Information, Warning, or Error
        Default: Debug

DogFeeder:
    # Rolling disk log file, written to the device's data directory and viewable at /log.txt.
    DiskLoggingEnabled: true
    # Debug, Info, Warn, or Error. Only entries at this level or higher are written to disk.
    DiskLogLevel: Info
    # Maximum size (KB) of the active log file before it rolls over (one backup file is kept).
    DiskLogMaxFileSizeKb: 256

    # Local schedule offset from UTC used for feeding window evaluation.
    # Example: -8 (Pacific Standard), -7 (Pacific Daylight), -5 (Eastern Standard)
    FeedingScheduleUtcOffsetHours: -7

    # Feeding windows in local time as fractional hour values.
    # Example: 6.5 = 6:30am, 21.25 = 9:15pm
    MorningWindowStartHour: 6
    MorningWindowEndHour: 8.5
    EveningWindowStartHour: 19
    EveningWindowEndHour: 22

    # Daily reset time in local time (hour when feeding state resets).
    # Example: 4 = 4:00am
    DailyResetTimeHour: 4

    # Pushover.net notification settings.
    PushoverApiToken:
    PushoverUserKey:
    PushoverAppName: Dog Feeder Reminder
    PushoverTest: false

    # MQTT broker settings (for Home Assistant integration).
    # Leave MqttBrokerHostname empty to disable MQTT.
    # MqttBrokerHostname: 192.168.1.100
    # MqttBrokerPort: 1883
    # MqttTopicPrefix: dog-feeder
    # MqttClientId: dog-feeder-device
    # Set these if Mosquitto requires authentication.
    # MqttUsername: mqttuser
    # MqttPassword: change-me

# MeadowCloud:
    # Enable Logging, Events, Command + Control
    # Enabled: false

    # Enable Over-the-air Updates
    # EnableUpdates: false

    # Enable Health Metrics
    # EnableHealthMetrics: false

    # How often to send metrics to Meadow.Cloud
    # HealthMetricsIntervalMinutes: 60
